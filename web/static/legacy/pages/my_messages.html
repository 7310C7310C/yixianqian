<div key="my_messages">
  <div class="back-nav" @click="handleBack">
    <van-icon name="arrow-left"></van-icon> 返回
  </div>
  <div class="page">
    <div v-if="loadingMyMessages" style="text-align:center; padding:40px;">
      <van-loading size="24px">加载中...</van-loading>
    </div>
    <van-empty v-else-if="!myMessagesList.length" description="你还没有发出过留言"></van-empty>
    <div v-else style="display:flex;flex-direction:column;gap:10px;">
      <div v-for="m in myMessagesList" :key="m.id" class="msg-card" style="align-items:flex-start;">
        <div class="msg-avatar">
          <img v-if="m.target_avatar" :src="m.target_avatar" alt="" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">
          <span v-else>💬</span>
        </div>
        <div class="msg-body">
          <div class="msg-name" style="font-size:13px;">留言给：{{ m.target_nickname }}</div>
          <div class="msg-sub msg-sub-strong" style="white-space:normal;">{{ m.content }}</div>
          <div class="msg-sub">{{ fmtTimeAgo(m.created_at) }}</div>
        </div>
        <div class="msg-right">
          <van-button class="tap-mini" size="mini" plain type="danger" @click="deleteMyMessage(m)">删除</van-button>
        </div>
      </div>
    </div>
  </div>
</div>
