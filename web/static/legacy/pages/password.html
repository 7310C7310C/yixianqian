<div key="password" class="password-page">
  <div class="back-nav" @click="handleBack">
    <van-icon name="arrow-left"></van-icon> 返回
  </div>
  <div class="page">
    <div class="pw-card">
      <div class="pw-title">修改密码</div>
      <div class="pw-tip">新密码至少 8 位，建议混合字母与数字。</div>
      <div v-if="passwordSubmitError" class="pw-error" role="alert">{{ passwordSubmitError }}</div>
      <van-cell-group inset>
        <van-field v-model="passwordForm.current" type="password" label="目前密码" placeholder="请输入目前密码"
          autocomplete="current-password" :error-message="passwordErrors.current" :disabled="passwordSubmitting"></van-field>
        <van-field v-model="passwordForm.password" type="password" label="新密码" placeholder="至少 8 位"
          autocomplete="new-password" :error-message="passwordErrors.password" :disabled="passwordSubmitting"></van-field>
        <van-field v-model="passwordForm.confirm" type="password" label="再次输入新密码" placeholder="再次输入新密码"
          autocomplete="new-password" :error-message="passwordErrors.confirm" :disabled="passwordSubmitting"></van-field>
      </van-cell-group>
      <div class="pw-actions">
        <van-button type="primary" color="#ff6b81" block round :loading="passwordSubmitting" :disabled="passwordSubmitting" @click="submitPassword">确认修改</van-button>
      </div>
    </div>
  </div>
</div>
