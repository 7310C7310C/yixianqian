<div key="mutual">
  <div class="back-nav" @click="handleBack">
    <van-icon name="arrow-left"></van-icon> 返回
  </div>
  <div class="page">
    <div v-if="loadingLikes" style="text-align:center; padding:40px;"><van-loading size="24px">加载中...</van-loading></div>
    <van-empty v-else-if="!likesData.mutual.length" description="还没有相互喜欢的人" image-size="60"></van-empty>
    <div v-else v-for="m in likesData.mutual" :key="m.initiator_openid" class="msg-card" style="align-items:flex-start;">
      <div class="msg-avatar">💕</div>
      <div class="msg-body">
        <div class="msg-name">{{ m.nickname }}</div>
        <div class="msg-sub" v-if="m.their_wechat">💚 对方微信号：<b>{{ m.their_wechat }}</b>，快去加好友吧～</div>
        <template v-else-if="m.wechat_required && !m.waiting_other">
          <div class="msg-sub">填写你的微信号并同意交换；双方都填好并同意后，系统会通知双方。</div>
          <van-field v-model="m.edit_wechat" placeholder="请输入微信号" maxlength="64" :border="false" style="padding:8px 0;"></van-field>
          <div style="display:flex; align-items:center; gap:8px; padding:2px 0 8px; font-size:13px; color:#646566;">
            <van-switch v-model="m.edit_agree" size="20px" />
            <span>我同意在相互喜欢后向对方展示微信号</span>
          </div>
          <van-button class="tap-44" type="primary" color="#ff6b81" size="small" block :loading="m.submitting" @click="submitMutualWechat(m)">保存并同意交换</van-button>
        </template>
        <div class="msg-sub" v-else>已同意交换，等待对方填写微信号并同意后，即可看到对方微信号。</div>
        <div class="msg-message" v-if="m.message">附言：{{ m.message }}</div>
      </div>
    </div>
  </div>
</div>
