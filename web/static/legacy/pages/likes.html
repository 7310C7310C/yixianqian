<div key="likes" class="page">
  <div class="msg-card" @click="openMyMessages" style="cursor:pointer;">
    <div class="msg-avatar">💬</div>
    <div class="msg-body">
      <div class="msg-name">我的留言</div>
      <div class="msg-sub">查看我在所有卡片下发出的留言</div>
    </div>
    <div class="msg-right"><span class="msg-count-wrap"><span v-if="!loadingMyMessages" class="msg-count">{{ myMessagesList.length }}</span><van-loading v-else size="14px" /></span><van-icon name="arrow" color="#c8c9cc" /></div>
  </div>
  <div class="msg-card" @click="openReceivedMessages" style="cursor:pointer;">
    <div class="msg-avatar">📨</div>
    <div class="msg-body">
      <div class="msg-name">收到的留言</div>
      <div class="msg-sub">查看别人发给我的留言</div>
    </div>
    <div class="msg-right"><span class="msg-count-wrap"><span v-if="!loadingReceivedMessages" class="msg-count">{{ receivedMessagesList.length }}</span><van-loading v-else size="14px" /></span><van-icon name="arrow" color="#c8c9cc" /></div>
  </div>
  <div class="msg-card" @click="openMyLikes" style="cursor:pointer;" v-if="!isObserver">
    <div class="msg-avatar">💕</div>
    <div class="msg-body">
      <div class="msg-name">我喜欢的</div>
      <div class="msg-sub">查看我喜欢的人，管理喜欢列表</div>
    </div>
    <div class="msg-right"><span class="msg-count-wrap"><span v-if="!loadingLikes" class="msg-count">{{ myLikesCount }}</span><van-loading v-else size="14px" /></span><van-icon name="arrow" color="#c8c9cc" /></div>
  </div>
  <div class="msg-card" @click="openMutual" style="cursor:pointer;" v-if="!isObserver">
    <div class="msg-avatar">💞</div>
    <div class="msg-body">
      <div class="msg-name">相互喜欢</div>
      <div class="msg-sub">你们已相互喜欢，可查看联系方式</div>
    </div>
    <div class="msg-right"><span class="msg-count-wrap"><span v-if="!loadingLikes" class="msg-count">{{ likesData.mutual.length }}</span><van-loading v-else size="14px" /></span><van-icon name="arrow" color="#c8c9cc" /></div>
  </div>
  <div class="msg-card" @click="openLikedMe" style="cursor:pointer;" v-if="!isObserver">
    <div class="msg-avatar">👤</div>
    <div class="msg-body">
      <div class="msg-name">谁喜欢了我</div>
      <div class="msg-sub">查看喜欢你的匿名用户</div>
    </div>
    <div class="msg-right"><span class="msg-count-wrap"><span v-if="!loadingLikes" class="msg-count">{{ likesData.liked_me.length }}</span><van-loading v-else size="14px" /></span><van-icon name="arrow" color="#c8c9cc" /></div>
  </div>
  <div class="section-title" v-if="notifications.length">🔔 动态</div>
  <div v-for="(n, i) in notifications" :key="i" class="msg-card">
    <div class="msg-avatar">🔔</div>
    <div class="msg-body">
      <div class="msg-sub msg-sub-strong">{{ n.text }}</div>
      <div class="msg-sub" v-if="n.time">{{ n.time }}</div>
    </div>
    <div class="msg-right" v-if="n.activity_id">
      <van-button class="tap-mini" type="primary" color="#ff6b81" size="mini" @click="openActivity(n.activity_id)">查看活动</van-button>
    </div>
  </div>
</div>
