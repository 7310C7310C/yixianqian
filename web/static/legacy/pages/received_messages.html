<div key="received_messages">
  <div class="back-nav" @click="handleBack">
    <van-icon name="arrow-left"></van-icon> 返回
  </div>
  <div class="page">
    <div v-if="loadingReceivedMessages" style="text-align:center; padding:40px;">
      <van-loading size="24px">加载中...</van-loading>
    </div>
    <van-empty v-else-if="!receivedMessagesList.length" description="还没有人给你留言"></van-empty>
    <div v-else style="display:flex;flex-direction:column;gap:10px;">
      <div v-for="m in receivedMessagesList" :key="m.id" class="msg-card" style="align-items:flex-start;">
        <div class="msg-avatar">
          <img v-if="m.author_avatar" :src="m.author_avatar" alt="" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">
          <span v-else>📨</span>
        </div>
        <div class="msg-body">
          <div class="msg-name" style="font-size:13px;">来自：{{ m.author_nickname }}</div>
          <div class="msg-sub msg-sub-strong" style="white-space:normal;">{{ m.content }}</div>
          <div class="msg-sub">{{ fmtTimeAgo(m.created_at) }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
