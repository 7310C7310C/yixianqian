<div key="my_likes">
  <div class="back-nav" @click="handleBack">
    <van-icon name="arrow-left"></van-icon> 返回
  </div>
  <div class="page">
    <div v-if="loadingMyLikes" style="text-align:center; padding:40px;">
      <van-loading size="24px">加载中...</van-loading>
    </div>
    <van-empty v-else-if="!myLikesList.length" description="你还没有喜欢过谁"></van-empty>
    <div v-else>
      <div v-for="l in myLikesList" :key="l.openid" class="like-item">
        <div class="like-item-avatar">
          <img v-if="l.photo" :src="l.photo" alt="" @error="retryImg($event, 2, ()=>{l.photo=''})" loading="lazy" decoding="async">
          <template v-else>{{ l.gender==='男性' ? '👨' : '👩' }}</template>
        </div>
        <div class="like-item-info">
          <div class="like-item-name">{{ l.nickname }} <span v-if="l.mutual" style="color:#ff6b81;font-size:13px;">💕 相互喜欢</span></div>
          <div class="like-item-meta">{{ l.age ? l.age+'岁' : '' }} {{ l.church ? '· '+l.church : '' }}</div>
          <div class="like-item-msg" v-if="l.mutual && l.message">附言：{{ l.message }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
