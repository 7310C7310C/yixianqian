name: CI
# 用户端：v1 Vue SPA + Go legacy API

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
concurrency:
  # push / PR 分組；同一 ref 的新 push 仍取消舊 push。
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # 完整历史：asset-version 门禁要覆盖 push before..HEAD / PR base..HEAD 的多提交范围。
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 静态资源版本
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="$PR_BASE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$PUSH_BEFORE"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="origin/main"
          fi
          python3 tools/check_asset_version.py --base "$base"
      - name: 文档一致性
        run: python3 tools/check_docs.py --strict
      - name: 性能预算与 nginx 护栏
        run: make perf-budget
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
          cache-dependency-path: go.sum
      - name: 下载依赖
        run: go mod download
      - name: 格式检查
        run: test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)
      # 新增/修改 web/static 源文件却没重生成 .gz 时这里失败（解压后逐字节比对，
      # 与 Go 版本无关：flate 输出跨版本不同，不能用压缩字节比较）。
      - name: 静态预压缩
        run: go run ./tools/static_gzip -check
      - name: 生成
        run: go generate ./...
      - name: vet
        run: go vet ./...
      - name: 构建
        run: go build -trimpath ./...
      - name: Python 工具测试
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: 部署闸沙箱单测
        run: bash deploy/autodeploy/test_autodeploy.sh

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: HEIC converter
        run: sudo apt-get update && sudo apt-get install -y libheif-examples libheif-plugin-libde265
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
          cache-dependency-path: go.sum
      - name: 下载依赖
        run: go mod download
      # internal/httpserver 多数测试需要真实 Postgres，放到 integration job。
      # internal/db 的单元测试（含 notification hub 并发回归）不需要数据库，留在本
      # job 用 -race 跑，才能抓到 map 并发这类竞态；TestIntegration* 无 DSN 会 skip。
      - name: 单元测试（无数据库）
        run: |
          set -euo pipefail
          PKGS=$(go list ./... | grep -v '/internal/httpserver$')
          go test -race -count=1 $PKGS

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yixianqian
          POSTGRES_PASSWORD: yixianqian
          POSTGRES_DB: yixianqian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yixianqian -d yixianqian_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://yixianqian:yixianqian@localhost:5432/yixianqian_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: HEIC converter
        run: sudo apt-get update && sudo apt-get install -y libheif-examples libheif-plugin-libde265
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
          cache-dependency-path: go.sum
      - name: 下载依赖
        run: go mod download
      # httpserver 单包测试串行要 ~90s，是 CI 关键路径。三个独立测试库并行：
      # internal/db + httpserver 按测试名奇偶分两片，各自 -race -p 1。
      - name: 集成测试（PostgreSQL，三分片并行）
        env:
          DB_BASE: postgres://yixianqian:yixianqian@localhost:5432
        run: |
          set -uo pipefail
          for db in yixianqian_test_http_a yixianqian_test_http_b; do
            docker exec "${{ job.services.postgres.id }}" createdb -U yixianqian "$db"
          done
          # 先列出测试名再奇偶分片；新测试自动纳入，不需要维护名单。
          mapfile -t names < <(go test -race -list '^Test' ./internal/httpserver | grep '^Test')
          if ((${#names[@]} < 50)); then
            echo "测试名单异常：只列出 ${#names[@]} 个测试" >&2
            exit 1
          fi
          shard_a=(); shard_b=()
          for i in "${!names[@]}"; do
            if ((i % 2 == 0)); then shard_a+=("${names[i]}"); else shard_b+=("${names[i]}"); fi
          done
          echo "分片：a=${#shard_a[@]} b=${#shard_b[@]}"
          run_a=$(IFS='|'; echo "${shard_a[*]}")
          run_b=$(IFS='|'; echo "${shard_b[*]}")
          status=0
          go test -race -p 1 -count=1 ./internal/db > /tmp/integration-db.log 2>&1 &
          p1=$!
          TEST_DATABASE_URL="$DB_BASE/yixianqian_test_http_a?sslmode=disable" \
            go test -race -p 1 -count=1 ./internal/httpserver -run "^(${run_a})$" > /tmp/integration-http-a.log 2>&1 &
          p2=$!
          TEST_DATABASE_URL="$DB_BASE/yixianqian_test_http_b?sslmode=disable" \
            go test -race -p 1 -count=1 ./internal/httpserver -run "^(${run_b})$" > /tmp/integration-http-b.log 2>&1 &
          p3=$!
          wait "$p1" || status=1
          wait "$p2" || status=1
          wait "$p3" || status=1
          cat /tmp/integration-db.log
          cat /tmp/integration-http-a.log
          cat /tmp/integration-http-b.log
          exit "$status"
