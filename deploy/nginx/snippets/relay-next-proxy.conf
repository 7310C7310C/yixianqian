# server2（HK）→ server1（LA）relay。三处 location 各自列全 proxy_set_header：
# nginx 的 proxy_* 指令按 location 继承，不同 location 之间不共享。
# 关键点：除 SSE 外不再关闭 proxy_buffering，且普通请求 Connection 置空以复用上游连接。

# 首页/接口/媒体：流式回源，但由 nginx 正常缓冲后转发。
location / {
    proxy_pass https://yxq_origin;
    proxy_ssl_server_name on;
    proxy_ssl_name $host;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;
    # 跨洋 TLS 每次重连偶发握手超时；复用 session 减少重复握手。
    proxy_ssl_session_reuse on;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_hide_header Strict-Transport-Security;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $yxq_conn;

    # 池内连接偶发失效时重试；POST 默认不重试（nginx 不会重放非幂等请求）。
    proxy_next_upstream error timeout http_502;
    # 跨洋 TLS 握手偶发超过 10s，放宽连接超时。
    proxy_connect_timeout 20s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# 批次9：/legacy/api/ 短缓存（10s，与 Go 侧 readCache 对齐）。
# - cache key 含 $yxq_static_enc（gzip/identity 分变体）与 $cookie_yxq_session（不跨用户）；
# - 只缓存 GET/HEAD 200；no-store/Set-Cookie 由 proxy_no_cache + 响应头控制；
# - 命中时直接回已压缩字节，nginx 不再重复压缩（gzip 模块见 Content-Encoding 即跳过）。
location /legacy/api/ {
    proxy_pass https://yxq_origin;
    proxy_ssl_server_name on;
    proxy_ssl_name $host;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;
    proxy_ssl_session_reuse on;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding $yxq_upstream_ae;
    proxy_hide_header Strict-Transport-Security;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $yxq_conn;

    proxy_cache yxqapi;
    proxy_cache_key "$scheme$request_method$host$request_uri|$yxq_static_enc|$cookie_yxq_session";
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 10s;
    proxy_cache_valid 401 403 404 0s;
    proxy_no_cache $http_authorization;
    proxy_ignore_headers Set-Cookie;
    proxy_hide_header Set-Cookie;
    proxy_cache_bypass $http_cache_control;
    add_header X-Cache-Status $upstream_cache_status always;

    proxy_connect_timeout 20s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}

# SSE 必须关闭缓冲，并放宽读超时；心跳 15s，由应用保持。
location = /legacy/api/notifications/stream {
    proxy_pass https://yxq_origin;
    proxy_ssl_server_name on;
    proxy_ssl_name $host;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;
    proxy_ssl_session_reuse on;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_hide_header Strict-Transport-Security;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $yxq_conn;

    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 20s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# 静态资源：边缘缓存 identity，回源只发生一次；带 ?v= 的资源按上游
# Cache-Control 1y immutable，裸路径 1h。
location /static/ {
    proxy_pass https://yxq_origin;
    proxy_ssl_server_name on;
    proxy_ssl_name $host;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;
    proxy_ssl_session_reuse on;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 规整后回源：Go 直接返回 .gz 预压缩变体，边缘按 $yxq_static_enc 分键缓存。
    proxy_set_header Accept-Encoding $yxq_upstream_ae;
    proxy_set_header Connection "";

    proxy_hide_header Strict-Transport-Security;
    proxy_http_version 1.1;

    proxy_cache yxqstatic;
    proxy_cache_key "$scheme$host$request_uri$yxq_static_enc";
    proxy_cache_valid 200 1h;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating;
    proxy_cache_methods GET HEAD;
    # 跟随上游 Cache-Control：带 ?v= 的应用/库资源为 1y immutable，裸路径 1h。
    # 上游禁用缓存时才由 proxy_cache_valid 兜底 1h（我们不设 no-store）。

    # location 内一旦有 add_header，server 级 HSTS 不再继承，必须重复。
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Cache-Status $upstream_cache_status always;

    proxy_connect_timeout 20s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
