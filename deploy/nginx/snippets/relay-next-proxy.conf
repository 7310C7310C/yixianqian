# server2（HK）→ server1（LA）relay。三处 location 各自列全 proxy_set_header：
# nginx 的 proxy_* 指令按 location 继承，不同 location 之间不共享。
# 关键点：除 SSE 外不再关闭 proxy_buffering，且普通请求 Connection 置空以复用上游连接。

# 首页/接口/媒体：流式回源，但由 nginx 正常缓冲后转发。
location / {
    proxy_pass https://yxq_origin;
    proxy_ssl_server_name on;
    proxy_ssl_name $host;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;
    # 跨洋 TLS 每次重连偶发握手超时；复用 session 减少重复握手。
    proxy_ssl_session_reuse on;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_hide_header Strict-Transport-Security;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $yxq_conn;

    # 池内连接偶发失效时重试；POST 默认不重试（nginx 不会重放非幂等请求）。
    proxy_next_upstream error timeout http_502;
    # 跨洋 TLS 握手偶发超过 10s，放宽连接超时。
    proxy_connect_timeout 20s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# SSE 必须关闭缓冲，并放宽读超时；心跳 15s，由应用保持。
location = /legacy/api/notifications/stream {
    proxy_pass https://yxq_origin;
    proxy_ssl_server_name on;
    proxy_ssl_name $host;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;
    proxy_ssl_session_reuse on;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_hide_header Strict-Transport-Security;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $yxq_conn;

    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 20s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# 静态资源：边缘缓存 identity，回源只发生一次；TTL 1h，先不加 immutable
# （lib/* 仍无版本参数，见 .team/perf/audit.md P1-1/M4）。
location /static/ {
    proxy_pass https://yxq_origin;
    proxy_ssl_server_name on;
    proxy_ssl_name $host;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;
    proxy_ssl_session_reuse on;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 缓存 identity，边缘 gzip；否则会把 gzip 变体发给不支持 gzip 的客户端。
    proxy_set_header Accept-Encoding "";
    proxy_set_header Connection "";

    proxy_hide_header Strict-Transport-Security;
    proxy_http_version 1.1;

    proxy_cache yxqstatic;
    proxy_cache_key "$scheme$host$request_uri";
    proxy_cache_valid 200 1h;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating;
    proxy_cache_methods GET HEAD;
    # 边缘 TTL 由本文件决定，不跟随上游 Cache-Control/Expires。
    proxy_ignore_headers Cache-Control Expires;

    # location 内一旦有 add_header，server 级 HSTS 不再继承，必须重复。
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Cache-Status $upstream_cache_status always;

    proxy_connect_timeout 20s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
