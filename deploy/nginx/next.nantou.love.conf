# 性能批次1：server1 本地应用连接复用。
# upstream 是 http 上下文指令；本文件由 sites-enabled/* 引入到 http。
upstream yxq_app {
    server 127.0.0.1:8093;
    keepalive 32;
    keepalive_timeout 60s;
}

# 边缘兜底：应用内限流在重启后清零；这里按真实客户端 IP 做粗粒度闸门。
# 30r/s + burst 60 足够首屏静态资源，正常用户不会碰到；SSE 单独 location。
limit_req_zone $binary_remote_addr zone=yxq_api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=yxq_conn:10m;

# 日志不含 query/referer：/activate?token=...、/admin/users?q=手机号、
# ?temp=临时密码 reveal token 都不得落盘。$uri 不含 args。
log_format yxq_safe '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                    '"$http_host" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name next.nantou.love;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name next.nantou.love;

    ssl_certificate /etc/ssl/yxq-next/fullchain.pem;
    ssl_certificate_key /etc/ssl/yxq-next/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    # 打开 ticket：TLS1.3 恢复依赖 ticket，关闭时每次新连接都要完整握手。
    ssl_session_tickets on;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # realip rewrites $remote_addr; use the original peer for the allow gate.
    if ($yxq_next_allowed = 0) { return 403; }
    server_tokens off;
    access_log /var/log/nginx/yxq-next.access.log yxq_safe;
    # 注册最多 9 张 12MP 照片；应用上限 9*MEDIA_MAX_BYTES+2MB（默认 92MB）。
    client_max_body_size 96m;

    location / {
        limit_req zone=yxq_api burst=60 nodelay;
        limit_conn yxq_conn 20;
        proxy_pass http://yxq_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # 磁盘只剩 ~1.9G：不把响应缓冲落到临时文件，只内存缓冲/直接流转。
        proxy_max_temp_file_size 0;
    }

    # SSE 需要关闭缓冲并放宽超时；其余请求走上面的 location /。
    location = /legacy/api/notifications/stream {
        proxy_pass http://yxq_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_max_temp_file_size 0;
    }

    # Prometheus 只在 server1 本机抓取；公网不暴露。
    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://yxq_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header Connection "";
    }
}
