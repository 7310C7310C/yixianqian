server {
    listen 80;
    listen [::]:80;
    server_name next.nantou.love;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name next.nantou.love;

    ssl_certificate /etc/ssl/yxq-next/fullchain.pem;
    ssl_certificate_key /etc/ssl/yxq-next/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1440m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # realip rewrites $remote_addr; use the original peer for the allow gate.
    if ($yxq_next_allowed = 0) { return 403; }
    server_tokens off;
    access_log off;
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
