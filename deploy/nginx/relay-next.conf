# 性能批次1：跨洋上游连接复用。
# nginx 只允许在 http 上下文使用 upstream/map/proxy_cache_path；本文件由
# sites-enabled/* 引入到 http，因此这些指令放在 server 之外。
upstream yxq_origin {
    server 172.245.223.118:443;
    keepalive 64;
    keepalive_timeout 60s;
}

# 普通请求把 Connection 置空以便复用；WebSocket/Upgrade 请求仍透传 upgrade。
map $http_upgrade $yxq_conn {
    default   "";
    websocket "upgrade";
}

# /static 预压缩变体：gzip/identity 分开缓存，命中时边缘不再压缩（1 vCPU）。
# 默认 identity；只把“接受”的形态判为 gzip（x-gzip、q=0、非法 q 都落 identity），
# 拒绝规则先匹配，所以重复 token 里出现 q=0 也算拒绝——与 Go 的“拒绝优先”一致。
map $http_accept_encoding $yxq_static_enc {
    default  identity;
    # 任一 gzip token 明确拒绝或 q 非法 → identity（与 Go 的“拒绝优先”一致）。
    "~*(?:^|,)\s*gzip\s*;\s*q\s*=\s*(?:0(?:\.0*)?\s*(?:,|$)|[^0-9.,])"  identity;
    # 裸 gzip token，或 q 值里含非零数字（q=0.5 / q=1）。
    "~*(?:^|,)\s*gzip\s*(?:,|$)"                                        gzip;
    "~*(?:^|,)\s*gzip\s*;\s*q\s*=\s*[0-9.]*[1-9][0-9.]*\s*(?:,|$)"    gzip;
}

# 回源时把 Accept-Encoding 规整成两态：Go 与边缘因此永远做同一个决定，
# 不会出现「identity 键里存了 gzip 字节」（唯一会伤到客户端的错配）。
map $yxq_static_enc $yxq_upstream_ae {
    default "";
    gzip    "gzip";
}

# 静态资源边缘缓存：跨洋只回源一次，之后在 HK 命中。
# Go 侧返回 .gz 预压缩变体；边缘按 gzip/identity 分开缓存，命中不再压缩。
# 目录与属主由 deploy 步骤创建（见 docs/runbooks/staging.md）。
proxy_cache_path /var/cache/nginx/yxq levels=1:2 keys_zone=yxqstatic:32m max_size=1g
                 inactive=7d use_temp_path=off;
# 批次9：/legacy/api/ 的 gzip/identity 变体缓存（短 TTL，按键含会话）。
# 目的：命中时不再逐请求压缩、且 gzip 客户端拿到已压缩字节；identity 变体单独保留。
# 注意：API 响应含个人数据 → TTL≤10s、目录 700、max_size 256m、inactive 5m。
proxy_cache_path /var/cache/nginx/yxqapi levels=1:2 keys_zone=yxqapi:16m max_size=256m
                 inactive=5m use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name next.nantou.love;

    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name next.nantou.love;

    ssl_certificate /etc/letsencrypt/live/next.nantou.love/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/next.nantou.love/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # server2 其他 vhost（relay-public.conf）已用 shared:SSL:10m，nginx 不允许同名 zone 不同大小。
    ssl_session_cache shared:YXQNEXT:20m;
    ssl_session_timeout 1d;
    # 打开 ticket：TLS1.3 恢复依赖 ticket，关闭时每次新连接都要完整握手。
    ssl_session_tickets on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;
    access_log off;
    # /static/ 缓存 identity 后由边缘压缩；server2 主配置的 gzip_types 默认是注释，
    # 这里必须显式声明，否则 nginx 只压 text/html，js/css 会以 identity 下发。
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    # 与 server1 vhost 一致：9 张注册照片按 10MiB/张可达 ~92MB，20m 会直接 413。
    client_max_body_size 96m;

    location /.well-known/acme-challenge/ { root /var/www/acme; }
    # 与 snippet 同值，作为 server 级默认；上游 TLS 握手复用可减少跨洋超时。
    proxy_ssl_session_reuse on;
    include /etc/nginx/snippets/relay-next-proxy.conf;
}
