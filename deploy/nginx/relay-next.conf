server {
    listen 80;
    listen [::]:80;
    server_name next.nantou.love;

    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name next.nantou.love;

    ssl_certificate /etc/letsencrypt/live/next.nantou.love/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/next.nantou.love/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1440m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;
    access_log off;
    client_max_body_size 20M;

    location /.well-known/acme-challenge/ { root /var/www/acme; }
    include /etc/nginx/snippets/relay-proxy.conf;
}
